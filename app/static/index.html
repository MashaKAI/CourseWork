<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Messenger</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0d15; --rail: #080a11; --panel: #121520; --panel-2: #1a1e2c; --line: #262b3c;
      --text: #f1f3fa; --tab-active: #2a3046; --muted: #8e97ae; --soft: rgba(124, 92, 255, .16);
      --grad: linear-gradient(135deg, #7c5cff 0%, #3ea8ff 100%);
      --accent: #8f78ff; --danger: #ff6b7a; --theirs: #1c2030; --shadow: 0 18px 50px rgba(0, 0, 0, .55);
      --mark: rgba(255, 207, 51, .38);
      --chat-bg: radial-gradient(900px 520px at 85% -10%, rgba(124, 92, 255, .14), transparent 70%),
                 radial-gradient(800px 480px at -10% 110%, rgba(62, 168, 255, .10), transparent 70%), #0b0d15;
    }
    :root[data-theme="light"] {
      color-scheme: light;
      --bg: #f2f4fb; --rail: #ffffff; --panel: #ffffff; --panel-2: #f1f3fa; --line: #e3e7f2;
      --text: #151a2e; --tab-active: #ffffff; --muted: #6b7490; --soft: rgba(124, 92, 255, .12);
      --accent: #6a4df0; --danger: #d93b4d; --theirs: #ffffff; --shadow: 0 18px 50px rgba(40, 50, 100, .20);
      --mark: rgba(255, 196, 0, .45);
      --chat-bg: radial-gradient(900px 520px at 85% -10%, rgba(124, 92, 255, .10), transparent 70%),
                 radial-gradient(800px 480px at -10% 110%, rgba(62, 168, 255, .10), transparent 70%), #f2f4fb;
    }
    @media (prefers-color-scheme: light) {
      :root:not([data-theme]) {
        color-scheme: light;
        --bg: #f2f4fb; --rail: #ffffff; --panel: #ffffff; --panel-2: #f1f3fa; --line: #e3e7f2;
        --text: #151a2e; --tab-active: #ffffff; --muted: #6b7490; --soft: rgba(124, 92, 255, .12);
        --accent: #6a4df0; --danger: #d93b4d; --theirs: #ffffff; --shadow: 0 18px 50px rgba(40, 50, 100, .20);
        --mark: rgba(255, 196, 0, .45);
        --chat-bg: radial-gradient(900px 520px at 85% -10%, rgba(124, 92, 255, .10), transparent 70%),
                   radial-gradient(800px 480px at -10% 110%, rgba(62, 168, 255, .10), transparent 70%), #f2f4fb;
      }
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: "Inter", "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
      font-size: 15px; font-weight: 600; line-height: 1.4; -webkit-font-smoothing: antialiased;
    }
    h1, h2, h3, p { margin: 0; }
    .hidden { display: none !important; }
    .mobile-only { display: none !important; }
    svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
    svg.fill { fill: currentColor; stroke: none; }
    ::-webkit-scrollbar { width: 10px; }
    ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 10px; border: 3px solid transparent; background-clip: content-box; }

    button { font: inherit; font-weight: 700; cursor: pointer; border: 0; color: inherit; background: none; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: .5rem; padding: .75rem 1.3rem; border-radius: 12px; color: #fff; background: var(--grad); box-shadow: 0 6px 18px rgba(104, 92, 255, .35); transition: transform .08s, filter .15s; }
    .btn:hover { filter: brightness(1.08); }
    .btn:active { transform: translateY(1px); }
    .btn:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }
    .btn.ghost { background: var(--panel-2); color: var(--text); box-shadow: none; }
    .btn.danger { background: var(--danger); box-shadow: none; }
    .ibtn { width: 40px; height: 40px; display: inline-flex; align-items: center; justify-content: center; border-radius: 12px; color: var(--muted); transition: background .15s, color .15s; flex: none; }
    .ibtn:hover { background: var(--panel-2); color: var(--text); }
    .ibtn:disabled { opacity: .4; cursor: not-allowed; }
    .field { width: 100%; font: inherit; font-weight: 600; color: var(--text); background: var(--panel-2); border: 1.5px solid transparent; border-radius: 12px; padding: .8rem 1rem; outline: none; transition: border-color .15s; }
    .field:focus { border-color: var(--accent); }
    ::placeholder { color: var(--muted); opacity: .9; font-weight: 600; }
    .error { color: var(--danger); font-weight: 700; font-size: .9rem; min-height: 1.3rem; }
    mark { background: var(--mark); color: inherit; border-radius: 4px; padding: 0 2px; }

    .avatar { display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; color: #fff; font-weight: 800; flex: none; user-select: none; text-shadow: 0 1px 2px rgba(0, 0, 0, .25); }
    .count { min-width: 22px; height: 22px; padding: 0 .45rem; border-radius: 11px; background: var(--grad); color: #fff; font-size: .75rem; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; flex: none; box-shadow: 0 3px 10px rgba(104, 92, 255, .4); }

    #toast { position: fixed; left: 50%; top: calc(14px + env(safe-area-inset-top)); transform: translateX(-50%); background: var(--danger); color: #fff; padding: .6rem 1.1rem; border-radius: 12px; box-shadow: var(--shadow); font-size: .9rem; z-index: 80; max-width: 92%; text-align: center; min-height: 0; }
    #toast:empty { display: none; }

    /* ---------- login ---------- */
    #login { min-height: 100%; display: grid; grid-template-columns: 1.1fr 1fr; background: var(--bg); }
    .hero { position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: center; gap: 2rem; padding: 4rem; color: #fff; background: var(--grad); }
    .hero::before, .hero::after { content: ""; position: absolute; border-radius: 50%; background: rgba(255, 255, 255, .12); }
    .hero::before { width: 520px; height: 520px; right: -160px; top: -180px; }
    .hero::after { width: 360px; height: 360px; left: -120px; bottom: -120px; background: rgba(255, 255, 255, .08); }
    .hero > * { position: relative; z-index: 1; }
    .hero .logo { width: 64px; height: 64px; border-radius: 20px; background: rgba(255, 255, 255, .2); display: flex; align-items: center; justify-content: center; backdrop-filter: blur(6px); }
    .hero .logo svg { width: 32px; height: 32px; }
    .hero h2 { font-size: 2.6rem; font-weight: 800; line-height: 1.1; letter-spacing: -.02em; max-width: 14ch; }
    .hero ul { list-style: none; padding: 0; margin: 0; display: grid; gap: .9rem; }
    .hero li { display: flex; align-items: center; gap: .8rem; font-size: 1.05rem; }
    .hero li span { width: 38px; height: 38px; border-radius: 12px; background: rgba(255, 255, 255, .18); display: inline-flex; align-items: center; justify-content: center; }
    .auth { display: flex; align-items: center; justify-content: center; padding: 2rem; }
    .auth-card { width: 100%; max-width: 380px; }
    .auth-card h1 { font-size: 1.9rem; font-weight: 800; letter-spacing: -.02em; }
    .auth-card .lead { color: var(--muted); margin: .35rem 0 1.6rem; }
    .tabs { display: grid; grid-template-columns: 1fr 1fr; background: var(--panel-2); border-radius: 14px; padding: 4px; margin-bottom: 1.2rem; }
    .tabs button { padding: .6rem; border-radius: 11px; color: var(--muted); }
    .tabs button.active { background: var(--tab-active); color: var(--text); box-shadow: 0 2px 8px rgba(0, 0, 0, .18); }
    .auth-card form { display: grid; gap: .75rem; }
    .auth-card form .btn { margin-top: .4rem; }
    .auth-card .error { margin-top: .8rem; }

    /* ---------- app layout ---------- */
    #app { display: grid; grid-template-columns: 76px 340px 1fr; height: 100vh; height: 100dvh; }
    #rail { background: var(--rail); border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; padding: 1rem 0; gap: .4rem; }
    #rail .logo { width: 44px; height: 44px; border-radius: 14px; background: var(--grad); color: #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 18px rgba(104, 92, 255, .4); margin-bottom: auto; }
    #rail .ibtn { width: 46px; height: 46px; }
    #rail .me { margin-top: .6rem; }

    #list-panel { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
    .list-head { display: flex; align-items: center; justify-content: space-between; gap: .5rem; padding: 1.2rem 1.2rem .6rem; }
    .list-head h2 { font-size: 1.5rem; font-weight: 800; letter-spacing: -.02em; display: flex; align-items: center; gap: .6rem; }
    .list-head small { display: block; color: var(--muted); font-weight: 700; margin-top: .1rem; }
    .list-actions { display: flex; align-items: center; gap: .3rem; }
    #new-chat { background: var(--grad); color: #fff; box-shadow: 0 6px 16px rgba(104, 92, 255, .35); }
    #new-chat:hover { background: var(--grad); filter: brightness(1.1); color: #fff; }
    #search-form { position: relative; margin: .5rem 1.2rem .8rem; }
    #search-form > span { position: absolute; left: .9rem; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; display: inline-flex; }
    #search-form svg { width: 18px; height: 18px; }
    #folders { display: flex; gap: .4rem; margin: 0 1.2rem .6rem; }
    #folders button { display: inline-flex; align-items: center; gap: .45rem; padding: .45rem .95rem; border-radius: 999px; color: var(--muted); font-weight: 700; transition: background .15s, color .15s; }
    #folders button:hover { background: var(--soft); }
    #folders button.active { background: var(--soft); color: var(--accent); }
    #folders .count { background: var(--soft); color: var(--accent); box-shadow: none; min-width: 20px; height: 20px; font-size: .7rem; }
    #folders button.active .count { background: var(--accent); color: #fff; }
    #search-form input { padding-left: 2.6rem; }
    #conv-list { flex: 1; overflow-y: auto; list-style: none; margin: 0; padding: 0 .6rem 1rem; }
    #conv-list li { display: flex; align-items: center; gap: .85rem; padding: .75rem .7rem; border-radius: 16px; cursor: pointer; transition: background .12s; }
    #conv-list li:hover { background: var(--panel-2); }
    #conv-list li.active { background: var(--soft); box-shadow: inset 3px 0 0 var(--accent); }
    #conv-list li.note { cursor: default; display: block; text-align: center; color: var(--muted); padding: 1.5rem 1rem; }
    #conv-list li.note:hover { background: transparent; }
    .conv-body { min-width: 0; flex: 1; }
    .conv-row { display: flex; align-items: baseline; justify-content: space-between; gap: .5rem; }
    .conv-row strong { font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .conv-row time { font-size: .75rem; color: var(--muted); flex: none; }
    .conv-sub { display: flex; align-items: center; justify-content: space-between; gap: .5rem; margin-top: .1rem; }
    .conv-preview { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: .88rem; }
    li.has-unread .conv-preview { color: var(--text); }
    li.has-unread time { color: var(--accent); }

    #main { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--chat-bg); position: relative; }
    #chat-header { display: flex; align-items: center; justify-content: space-between; gap: .75rem; padding: .8rem 1.3rem; background: var(--panel); border-bottom: 1px solid var(--line); min-height: 72px; }
    .head-left { display: flex; align-items: center; gap: .85rem; min-width: 0; }
    #chat-title { font-weight: 800; font-size: 1.08rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #chat-sub { font-size: .84rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .menu-wrap { position: relative; }
    #menu { position: absolute; right: 0; top: calc(100% + 8px); z-index: 30; min-width: 280px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: .45rem; }
    #menu button { display: flex; align-items: center; gap: .8rem; width: 100%; text-align: left; border-radius: 10px; padding: .65rem .8rem; }
    #menu button:hover { background: var(--panel-2); }
    #menu button svg { color: var(--muted); }
    #menu button.danger, #menu button.danger svg { color: var(--danger); }
    #menu .sep { height: 1px; background: var(--line); margin: .35rem .4rem; }
    #chat-search { display: flex; align-items: center; gap: .4rem; padding: .6rem 1.3rem; background: var(--panel); border-bottom: 1px solid var(--line); }
    #chat-search span { color: var(--muted); font-size: .85rem; white-space: nowrap; padding: 0 .3rem; }

    #messages { flex: 1; min-height: 0; overflow-y: auto; padding: 1.2rem 1.5rem; display: flex; flex-direction: column; gap: .3rem; overscroll-behavior: contain; }
    .day { align-self: center; margin: 1rem 0 .5rem; padding: .25rem .9rem; background: var(--panel); border: 1px solid var(--line); color: var(--muted); border-radius: 999px; font-size: .76rem; font-weight: 800; }
    .msg { max-width: min(560px, 78%); padding: .55rem .85rem .4rem; border-radius: 18px 18px 18px 5px; background: var(--theirs); border: 1px solid var(--line); overflow-wrap: anywhere; align-self: flex-start; box-shadow: 0 2px 8px rgba(0, 0, 0, .08); }
    .msg.mine { align-self: flex-end; color: #fff; background: var(--grad); border: 0; border-radius: 18px 18px 5px 18px; box-shadow: 0 6px 18px rgba(104, 92, 255, .30); }
    .msg .who { font-size: .78rem; font-weight: 800; color: var(--accent); margin-bottom: .1rem; }
    .msg .body { white-space: pre-wrap; }
    .msg time { display: block; font-size: .7rem; font-weight: 700; opacity: .6; text-align: right; margin-top: .1rem; }
    .msg img { display: block; max-width: 100%; width: auto; max-height: 300px; border-radius: 12px; cursor: zoom-in; margin: .2rem 0; }
    .msg.cur-match { outline: 2px solid var(--accent); outline-offset: 2px; }
    .msg.flash { animation: flash 2.2s ease-out; }
    @keyframes flash { 0%, 55% { box-shadow: 0 0 0 4px var(--accent), 0 0 28px var(--accent); } 100% { box-shadow: 0 2px 8px rgba(0, 0, 0, .08); } }
    .empty-state { margin: auto; text-align: center; color: var(--muted); max-width: 320px; display: grid; gap: .8rem; justify-items: center; }
    .empty-state .art { width: 110px; height: 110px; border-radius: 34px; background: var(--soft); color: var(--accent); display: flex; align-items: center; justify-content: center; }
    .empty-state .art svg { width: 52px; height: 52px; }
    .empty-state h3 { color: var(--text); font-size: 1.2rem; font-weight: 800; }
    #send-form { display: flex; align-items: center; gap: .5rem; margin: .4rem 1.3rem 1.2rem; padding: .45rem; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); }
    #send-form #text { flex: 1; min-width: 0; background: transparent; padding: .6rem .5rem; border-radius: 10px; }
    #send-form #text:focus { background: transparent; border-color: transparent; }
    #send-form #text::placeholder { opacity: .6; }
    #send-btn { width: 46px; height: 46px; border-radius: 14px; padding: 0; flex: none; }
    #attach-chip { display: flex; align-items: center; gap: .2rem; max-width: 150px; font-size: .82rem; color: var(--text); background: var(--soft); border-radius: 999px; padding: .15rem .2rem .15rem .8rem; flex: none; }
    #attach-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #attach-chip .ibtn { width: 28px; height: 28px; border-radius: 50%; }

    #modal { position: fixed; inset: 0; background: rgba(5, 7, 14, .65); backdrop-filter: blur(6px); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 1rem; }
    #modal-box { background: var(--panel); border: 1px solid var(--line); border-radius: 22px; max-width: 520px; width: 100%; max-height: 90vh; overflow: auto; padding: 1.5rem; position: relative; box-shadow: var(--shadow); }
    #modal-box.wide { max-width: 900px; }
    #modal-close { position: absolute; top: .9rem; right: .9rem; }
    #modal-content { display: grid; gap: .8rem; }
    #modal-content h3 { font-size: 1.3rem; font-weight: 800; margin-right: 2.5rem; letter-spacing: -.01em; }
    #modal-content .hint { color: var(--muted); font-size: .9rem; margin-top: -.4rem; }
    #modal-content > img { max-width: 100%; max-height: 78vh; margin: 0 auto; border-radius: 14px; }
    .pick-list { display: grid; gap: .2rem; max-height: 280px; overflow-y: auto; }
    .pick-row { display: flex; align-items: center; gap: .8rem; padding: .55rem .6rem; border-radius: 14px; cursor: pointer; }
    .pick-row:hover { background: var(--panel-2); }
    .pick-row .grow, .member .grow { flex: 1; min-width: 0; }
    .pick-row small, .member small { color: var(--muted); }
    .pick-row input { appearance: none; width: 22px; height: 22px; border-radius: 7px; border: 2px solid var(--line); display: grid; place-content: center; flex: none; cursor: pointer; }
    .pick-row input:checked { background: var(--grad); border-color: transparent; }
    .pick-row input:checked::after { content: ""; width: 6px; height: 11px; border: solid #fff; border-width: 0 2.5px 2.5px 0; transform: rotate(45deg) translate(-1px, -1px); }
    #gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: .6rem; }
    #gallery img { width: 100%; height: 150px; object-fit: cover; border-radius: 14px; cursor: zoom-in; transition: transform .15s; }
    #gallery img:hover { transform: scale(1.03); }
    .member { display: flex; align-items: center; gap: .8rem; padding: .5rem 0; }
    .badge { font-size: .68rem; font-weight: 800; background: var(--soft); color: var(--accent); padding: .12rem .55rem; border-radius: 999px; margin-left: .45rem; text-transform: uppercase; letter-spacing: .04em; }
    .member .btn { padding: .4rem .9rem; border-radius: 10px; }

    @media (max-width: 900px) and (min-width: 721px) {
      #app { grid-template-columns: 64px 280px 1fr; }
      #login { grid-template-columns: 1fr; }
      .hero { display: none; }
    }

    /* ---------- phone: one screen at a time (list or chat) ---------- */
    @media (max-width: 720px) {
      .mobile-only { display: inline-flex !important; }
      #login { grid-template-columns: 1fr; }
      .hero { display: none; }
      .auth { padding: 1.5rem 1.2rem; align-items: flex-start; padding-top: 12vh; }
      .field { font-size: 16px; }  /* 16px stops iOS from zooming into inputs */
      #app { display: block; }
      #rail { display: none; }
      #list-panel, #main { height: 100vh; height: 100dvh; border: 0; }
      #app[data-view="list"] #main { display: none; }
      #app[data-view="chat"] #list-panel { display: none; }
      .list-head { padding: calc(1rem + env(safe-area-inset-top)) 1rem .5rem; }
      #search-form { margin: .4rem 1rem .7rem; }
      #conv-list { padding: 0 .4rem calc(1rem + env(safe-area-inset-bottom)); }
      #conv-list li { padding: .8rem .6rem; }
      #chat-header { padding: calc(.55rem + env(safe-area-inset-top)) .7rem .55rem .4rem; min-height: 64px; gap: .3rem; }
      .head-left { gap: .6rem; }
      #chat-search { padding: .5rem .7rem; }
      #messages { padding: .8rem .7rem; }
      .msg { max-width: 88%; }
      .msg img { max-height: 240px; }
      #send-form { margin: .3rem .6rem calc(.6rem + env(safe-area-inset-bottom)); gap: .25rem; }
      #attach-chip { max-width: 90px; }
      #send-form #text { padding-left: .3rem; padding-right: .3rem; }
      #send-form #text::placeholder { font-size: 13.5px; }
      #menu { position: fixed; left: 0; right: 0; top: auto; bottom: 0; min-width: 0; border-radius: 22px 22px 0 0; padding: .6rem .6rem calc(.6rem + env(safe-area-inset-bottom)); box-shadow: 0 0 0 100vmax rgba(5, 7, 14, .55); }
      #menu button { padding: .9rem .8rem; }
      #modal { align-items: flex-end; padding: 0; }
      #modal-box { max-width: none !important; border-radius: 22px 22px 0 0; max-height: 88vh; max-height: 88dvh; padding: 1.2rem 1.1rem calc(1.2rem + env(safe-area-inset-bottom)); }
      #gallery { grid-template-columns: repeat(3, 1fr); }
      #gallery img { height: 110px; }
    }
  </style>
</head>
<body>
  <div id="toast" role="alert"></div>

  <section id="login">
    <div class="hero">
      <div class="logo"><span data-icon="chat"></span></div>
      <h2>Спілкуйтесь просто і красиво</h2>
      <ul>
        <li><span data-icon="users"></span>Особисті та групові розмови</li>
        <li><span data-icon="image"></span>Фотографії просто в чаті</li>
        <li><span data-icon="lock"></span>Паролі зберігаються лише як хеші</li>
      </ul>
    </div>
    <div class="auth">
      <div class="auth-card">
        <h1>Вітаємо</h1>
        <p class="lead">Увійдіть або створіть акаунт.</p>
        <div class="tabs">
          <button type="button" id="tab-login" class="active">Вхід</button>
          <button type="button" id="tab-register">Реєстрація</button>
        </div>
        <form id="login-form">
          <input class="field" id="login-tag" placeholder="Ваш тег" maxlength="33" autocomplete="username" autocapitalize="none" required>
          <input class="field" id="login-password" type="password" placeholder="Пароль" autocomplete="current-password" required>
          <button class="btn">Увійти</button>
        </form>
        <form id="register-form" class="hidden">
          <input class="field" id="reg-name" placeholder="Ім'я" maxlength="32" autocomplete="off" required>
          <input class="field" id="reg-tag" placeholder="Тег: латиниця, цифри, _ (artem_k)" maxlength="33" autocomplete="off" autocapitalize="none" required>
          <input class="field" id="reg-password" type="password" placeholder="Пароль (від 6 символів)" autocomplete="new-password" required>
          <input class="field" id="reg-password2" type="password" placeholder="Повторіть пароль" autocomplete="new-password" required>
          <button class="btn">Створити акаунт</button>
        </form>
        <p class="error" id="login-error"></p>
      </div>
    </div>
  </section>

  <div id="app" class="hidden" data-view="list">
    <nav id="rail">
      <div class="logo"><span data-icon="chat"></span></div>
      <button class="ibtn theme-btn" title="Змінити тему" aria-label="Змінити тему"></button>
      <button class="ibtn logout-btn" title="Вийти" aria-label="Вийти"><span data-icon="leave"></span></button>
      <span class="me" id="me-avatar"></span>
    </nav>

    <aside id="list-panel">
      <div class="list-head">
        <div>
          <h2>Чати <span id="total-unread" class="count hidden"></span></h2>
          <small id="me-line"></small>
        </div>
        <div class="list-actions">
          <button class="ibtn theme-btn mobile-only" title="Змінити тему" aria-label="Змінити тему"></button>
          <button class="ibtn logout-btn mobile-only" title="Вийти" aria-label="Вийти"><span data-icon="leave"></span></button>
          <button id="new-chat" class="ibtn" title="Нова розмова" aria-label="Нова розмова"><span data-icon="plus"></span></button>
        </div>
      </div>
      <form id="search-form">
        <span data-icon="search"></span>
        <input class="field" id="search-q" placeholder="Пошук повідомлень" autocomplete="off" enterkeyhint="search">
      </form>
      <div id="folders" role="tablist" aria-label="Тип чатів">
        <button type="button" role="tab" data-folder="dm" class="active">DM <span class="count hidden"></span></button>
        <button type="button" role="tab" data-folder="bots">BOTS <span class="count hidden"></span></button>
      </div>
      <ul id="conv-list"></ul>
    </aside>

    <main id="main">
      <div id="chat-header">
        <div class="head-left">
          <button type="button" id="back" class="ibtn mobile-only" aria-label="Назад до чатів"><span data-icon="back"></span></button>
          <span id="chat-avatar"></span>
          <div style="min-width:0">
            <div id="chat-title">Оберіть розмову</div>
            <div id="chat-sub"></div>
          </div>
        </div>
        <div class="menu-wrap">
          <button type="button" id="menu-btn" class="ibtn hidden" title="Меню" aria-label="Меню"><svg class="fill" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="12" cy="19" r="1.9"/></svg></button>
          <div id="menu" class="hidden"></div>
        </div>
      </div>
      <form id="chat-search" class="hidden">
        <input class="field" id="chat-search-q" placeholder="Слово чи фраза в цьому чаті" autocomplete="off" enterkeyhint="search">
        <span id="chat-search-count"></span>
        <button type="button" id="cs-prev" class="ibtn" aria-label="Попереднє співпадіння"><span data-icon="up"></span></button>
        <button type="button" id="cs-next" class="ibtn" aria-label="Наступне співпадіння"><span data-icon="down"></span></button>
        <button type="button" id="chat-search-close" class="ibtn" aria-label="Закрити пошук"><span data-icon="x"></span></button>
      </form>
      <div id="messages"></div>
      <form id="send-form" class="hidden">
        <button type="button" id="attach" class="ibtn" title="Прикріпити фото" aria-label="Прикріпити фото"><span data-icon="clip"></span></button>
        <input type="file" id="file" accept="image/*" class="hidden">
        <span id="attach-chip" class="hidden"><span id="attach-name"></span><button type="button" id="attach-clear" class="ibtn" aria-label="Прибрати фото"><span data-icon="x"></span></button></span>
        <input class="field" id="text" placeholder="Напишіть повідомлення · макс. 2000 символів" maxlength="2000" autocomplete="off" enterkeyhint="send">
        <button id="send-btn" class="btn" aria-label="Надіслати"><span data-icon="send"></span></button>
      </form>
    </main>
  </div>

  <div id="modal" class="hidden">
    <div id="modal-box">
      <button type="button" id="modal-close" class="ibtn" aria-label="Закрити"><span data-icon="x"></span></button>
      <div id="modal-content"></div>
    </div>
  </div>

  <script>
    const POLL_MS = 2000;
    const $ = (id) => document.getElementById(id);
    const state = {
      token: null, me: null, users: [], convs: [], current: null,
      blocked: new Set(), msgs: [], msgSig: "", photo: null, photoBusy: false,
      drafts: {}, folder: "dm", filter: "", matchIds: [], matchId: null,
      search: { q: "", results: null }, flashId: null, flashUntil: 0, pushed: false, sending: false,
    };
    let pollTimer = null;
    let historyRequest = 0;
    let searchTimer = null;
    let toastTimer = null;
    const isMobile = () => window.matchMedia("(max-width: 720px)").matches;
    const MESSAGE_LIMIT = 2000;
    const composePlaceholder = () => (isMobile() ? "Повідомлення" : "Напишіть повідомлення") + ` · макс. ${MESSAGE_LIMIT} символів`;

    // ---- icons (static markup only, never user data) ----
    const ICONS = {
      chat: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
      search: '<circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>',
      image: '<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/>',
      users: '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
      lock: '<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
      ban: '<circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/>',
      clear: '<circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>',
      trash: '<polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>',
      leave: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>',
      plus: '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
      edit: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>',
      x: '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
      clip: '<path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>',
      send: '<line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>',
      sun: '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>',
      moon: '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>',
      back: '<polyline points="15 18 9 12 15 6"/>',
      up: '<polyline points="18 15 12 9 6 15"/>',
      down: '<polyline points="6 9 12 15 18 9"/>',
    };
    const svg = (name) => `<svg viewBox="0 0 24 24">${ICONS[name]}</svg>`;
    function paintIcons() {
      document.querySelectorAll("[data-icon]").forEach((e) => { e.innerHTML = svg(e.dataset.icon); e.style.display = "inline-flex"; });
    }

    // ---- theme ----
    const prefersLight = () => window.matchMedia("(prefers-color-scheme: light)").matches;
    const currentTheme = () => document.documentElement.dataset.theme || (prefersLight() ? "light" : "dark");
    function paintThemeButtons() {
      document.querySelectorAll(".theme-btn").forEach((b) => { b.innerHTML = svg(currentTheme() === "dark" ? "sun" : "moon"); });
    }
    function toggleTheme() {
      const next = currentTheme() === "dark" ? "light" : "dark";
      document.documentElement.dataset.theme = next;
      try { localStorage.setItem("messengerTheme", next); } catch {}
      paintThemeButtons();
    }
    document.querySelectorAll(".theme-btn").forEach((b) => { b.onclick = toggleTheme; });
    try {
      const saved = localStorage.getItem("messengerTheme");
      if (saved === "light" || saved === "dark") document.documentElement.dataset.theme = saved;
    } catch {}

    // ---- menu ----
    const MENU = [
      ["search", "search", "Пошук у чаті"],
      ["photos", "image", "Фотографії"],
      ["members", "users", "Учасники"],
      ["rename", "edit", "Перейменувати групу"],
      ["block", "ban", "Заблокувати"],
      ["sep"],
      ["clear", "clear", "Видалити всі повідомлення", true],
      ["delete", "trash", "Видалити контакт", true],
      ["deleteall", "trash", "Видалити групу для всіх", true],
    ];
    function buildMenu() {
      $("menu").replaceChildren(...MENU.map(([act, icon, label, danger]) => {
        if (act === "sep") return el("div", "sep");
        const b = document.createElement("button");
        b.type = "button";
        b.dataset.act = act;
        if (danger) b.className = "danger";
        b.innerHTML = svg(icon);
        b.append(el("span", "", label));
        return b;
      }));
    }
    const menuItem = (act) => $("menu").querySelector(`[data-act="${act}"]`);
    const setLabel = (act, text) => { menuItem(act).querySelector("span").textContent = text; };

    // ---- helpers ----
    function el(tag, className, text) {
      const e = document.createElement(tag);
      if (className) e.className = className;
      if (text !== undefined) e.textContent = text;
      return e;
    }
    function avatar(name, size) {
      const a = el("span", "avatar");
      let h = 0;
      for (const ch of name) h = (h * 31 + ch.codePointAt(0)) % 360;
      a.style.cssText = `width:${size}px;height:${size}px;font-size:${Math.round(size * .4)}px;background:linear-gradient(135deg,hsl(${h} 70% 55%),hsl(${(h + 45) % 360} 70% 45%))`;
      a.textContent = (name.trim()[0] || "?").toUpperCase();
      return a;
    }
    // Wraps every case-insensitive occurrence of q in <mark>; returns a fragment of text nodes.
    function highlight(text, q) {
      const frag = document.createDocumentFragment();
      if (!q) { frag.append(text); return frag; }
      const lower = text.toLowerCase();
      const ql = q.toLowerCase();
      let i = 0;
      let pos;
      while ((pos = lower.indexOf(ql, i)) !== -1) {
        if (pos > i) frag.append(text.slice(i, pos));
        frag.append(el("mark", "", text.slice(pos, pos + ql.length)));
        i = pos + ql.length;
      }
      if (i < text.length) frag.append(text.slice(i));
      return frag;
    }

    // Shows errors as "Помилка: текст." (first letter lowercased, full stop at the end).
    function errText(message) {
      let t = String(message).trim();
      if (!t) t = "щось пішло не так";
      t = t[0].toLowerCase() + t.slice(1);
      if (!/[.!?]$/.test(t)) t += ".";
      return "Помилка: " + t;
    }
    // "chat-error" is the global toast (visible on every screen); other ids are inline.
    function showError(id, err) {
      const text = errText(err && err.message !== undefined ? err.message : err);
      if (id === "chat-error") {
        $("toast").textContent = text;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => { $("toast").textContent = ""; }, 5000);
      } else {
        $(id).textContent = text;
      }
    }
    function clearError(id) {
      if (id === "chat-error") { clearTimeout(toastTimer); $("toast").textContent = ""; } else { $(id).textContent = ""; }
    }

    async function api(method, path, body) {
      const headers = {};
      if (body) headers["Content-Type"] = "application/json";
      if (state.token) headers["Authorization"] = "Bearer " + state.token;
      let res;
      try {
        res = await fetch("/api" + path, { method, headers, body: body ? JSON.stringify(body) : undefined });
      } catch {
        throw new Error("Немає зв'язку із сервером");
      }
      if (res.status === 204) return null;
      const data = await res.json().catch(() => null);
      if (!res.ok) {
        const d = data && data.detail;
        if (res.status === 401 && state.token && path !== "/logout") {
          logout(false, "Сесія недійсна, увійдіть знову");
        }
        throw new Error(typeof d === "string" ? d : "Некоректний запит");
      }
      return data;
    }

    const userName = (id) => (state.users.find((u) => u.id === id) || {}).username || "Невідомий";
    const tagOf = (u) => (u && u.tag ? "@" + u.tag : "");
    const timeOnly = (iso) => new Date(iso).toLocaleTimeString("uk-UA", { hour: "2-digit", minute: "2-digit" });
    const fullTime = (iso) => new Date(iso).toLocaleString("uk-UA", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
    const dayStart = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
    function dayLabel(iso) {
      const d = new Date(iso);
      const diff = Math.round((dayStart(new Date()) - dayStart(d)) / 86400000);
      if (diff === 0) return "Сьогодні";
      if (diff === 1) return "Вчора";
      return d.toLocaleDateString("uk-UA", { day: "numeric", month: "long", year: d.getFullYear() === new Date().getFullYear() ? undefined : "numeric" });
    }
    function listTime(iso) {
      const d = new Date(iso);
      if (dayStart(d) === dayStart(new Date())) return timeOnly(iso);
      return d.toLocaleDateString("uk-UA", { day: "2-digit", month: "2-digit" });
    }
    const isGroup = (c) => !!c.is_group;
    const isAdmin = (c) => isGroup(c) && c.admin_id === state.me.id;
    const otherUser = (c) => {
      if (!c || isGroup(c)) return null;
      return state.users.find((u) => u.id !== state.me.id && c.participants.includes(u.id)) || null;
    };
    function convTitle(c) {
      if (c.title) return c.title;
      const others = c.participants.filter((id) => id !== state.me.id).map(userName);
      return others.join(", ") || "Розмова";
    }
    function emptyState(title, text) {
      const box = el("div", "empty-state");
      const art = el("div", "art");
      art.innerHTML = svg("chat");
      box.append(art, el("h3", "", title), el("div", "", text));
      return box;
    }
    const setView = (v) => { $("app").dataset.view = v; };

    // ---- login / registration ----
    async function enter(user, token) {
      state.token = token;
      state.me = user;
      try { sessionStorage.setItem("messengerToken", token); } catch {}
      $("login").classList.add("hidden");
      $("app").classList.remove("hidden");
      $("me-avatar").replaceChildren(avatar(user.username, 42));
      $("me-avatar").title = `${user.username} ${tagOf(user)}`;
      $("me-line").textContent = `${user.username} · ${tagOf(user)}`;
      state.users = await api("GET", "/users");
      await refreshBlocked();
      await refreshConvs();
      resetChat();
      clearInterval(pollTimer);
      pollTimer = setInterval(tick, POLL_MS);
    }

    function showTab(registering) {
      $("login-form").classList.toggle("hidden", registering);
      $("register-form").classList.toggle("hidden", !registering);
      $("tab-login").classList.toggle("active", !registering);
      $("tab-register").classList.toggle("active", registering);
      clearError("login-error");
    }
    $("tab-login").onclick = () => showTab(false);
    $("tab-register").onclick = () => showTab(true);

    async function authSuccess(data) {
      const { token, ...user } = data;
      await enter(user, token);
    }

    $("login-form").onsubmit = async (e) => {
      e.preventDefault();
      clearError("login-error");
      try {
        const data = await api("POST", "/login", { tag: $("login-tag").value, password: $("login-password").value });
        $("login-password").value = "";
        await authSuccess(data);
      } catch (err) {
        showError("login-error", err);
      }
    };

    $("register-form").onsubmit = async (e) => {
      e.preventDefault();
      clearError("login-error");
      const password = $("reg-password").value;
      if (password !== $("reg-password2").value) {
        showError("login-error", "Паролі не збігаються");
        return;
      }
      try {
        const data = await api("POST", "/users", {
          username: $("reg-name").value.trim(),
          tag: $("reg-tag").value,
          password,
          password_repeat: $("reg-password2").value,
        });
        $("register-form").reset();
        await authSuccess(data);
      } catch (err) {
        showError("login-error", err);
      }
    };

    async function logout(callApi = true, message = "") {
      if (callApi && state.token) { try { await api("POST", "/logout"); } catch {} }
      clearInterval(pollTimer);
      try { sessionStorage.removeItem("messengerToken"); } catch {}
      Object.assign(state, {
        token: null, me: null, convs: [], users: [], current: null, blocked: new Set(), msgs: [], msgSig: "",
        drafts: {}, search: { q: "", results: null },
      });
      $("search-q").value = "";
      $("app").classList.add("hidden");
      $("login").classList.remove("hidden");
      document.title = "Messenger";
      closeModal();
      showTab(false);
      if (message) showError("login-error", message);
    }
    document.querySelectorAll(".logout-btn").forEach((b) => { b.onclick = () => logout(true); });

    // ---- conversation list, unread counters ----
    async function refreshConvs() {
      const convs = await api("GET", "/conversations");
      const at = (c) => (c.last_message ? new Date(c.last_message.created_at).getTime() : 0);
      state.convs = convs.sort((a, b) => at(b) - at(a));
      renderConvs();
    }

    function updateUnreadTotal() {
      const total = state.convs.reduce((sum, c) => sum + (c.unread || 0), 0);
      const badge = $("total-unread");
      badge.textContent = total > 99 ? "99+" : String(total);
      badge.classList.toggle("hidden", total === 0);
      document.title = total ? `(${total}) Messenger` : "Messenger";
    }

    // The chat is "being looked at" only when the tab is visible and (on a phone) the chat screen is open.
    function viewing() {
      return !!state.current && document.visibilityState === "visible" && (!isMobile() || $("app").dataset.view === "chat");
    }
    async function markReadIfNeeded() {
      if (!viewing()) return;
      const fresh = state.convs.find((x) => x.id === state.current.id);
      if (!fresh || !fresh.unread) return;
      fresh.unread = 0;
      renderConvs();
      try { await api("POST", `/conversations/${fresh.id}/read`); } catch {}
    }

    function previewText(c) {
      const m = c.last_message;
      if (!m) return "Повідомлень ще немає";
      const body = m.text || "Фото";
      if (m.sender_id === state.me.id) return "Ви: " + body;
      return (isGroup(c) ? userName(m.sender_id) + ": " : "") + body;
    }

    const folderOf = (c) => (c.is_bot_chat ? "bots" : "dm");

    function updateFolders() {
      document.querySelectorAll("#folders button").forEach((b) => {
        const f = b.dataset.folder;
        const unread = state.convs.filter((c) => folderOf(c) === f).reduce((sum, c) => sum + (c.unread || 0), 0);
        const badge = b.querySelector(".count");
        badge.textContent = unread > 99 ? "99+" : String(unread);
        badge.classList.toggle("hidden", unread === 0);
        b.classList.toggle("active", f === state.folder);
        b.setAttribute("aria-selected", f === state.folder ? "true" : "false");
      });
    }
    document.querySelectorAll("#folders button").forEach((b) => {
      b.onclick = () => { state.folder = b.dataset.folder; renderConvs(); };
    });

    function renderConvs() {
      updateUnreadTotal();
      updateFolders();
      if (state.search.results) { renderSearchResults(); return; }
      const items = state.convs.filter((c) => folderOf(c) === state.folder).map((c) => {
        const li = el("li", (state.current && state.current.id === c.id ? "active " : "") + (c.unread ? "has-unread" : ""));
        const row = el("div", "conv-row");
        row.append(el("strong", "", convTitle(c)));
        if (c.last_message) {
          const t = el("time", "", listTime(c.last_message.created_at));
          t.dateTime = c.last_message.created_at;
          row.append(t);
        }
        const sub = el("div", "conv-sub");
        sub.append(el("div", "conv-preview", previewText(c)));
        if (c.unread) sub.append(el("span", "count", c.unread > 99 ? "99+" : String(c.unread)));
        const body = el("div", "conv-body");
        body.append(row, sub);
        li.append(avatar(convTitle(c), 50), body);
        li.onclick = () => openConv(c);
        return li;
      });
      if (!items.length) items.push(el("li", "note", state.folder === "bots" ? "Ботів поки немає." : "Розмов поки немає. Натисніть плюс, щоб почати першу."));
      $("conv-list").replaceChildren(...items);
    }

    // ---- search across all chats (results replace the chat list; a click jumps to the message) ----
    function renderSearchResults() {
      const { q, results } = state.search;
      const items = [el("li", "note", results.length ? `Знайдено повідомлень: ${results.length}` : "Нічого не знайдено")];
      for (const m of results) {
        const c = state.convs.find((x) => x.id === m.conversation_id);
        if (!c) continue;
        const li = el("li");
        const row = el("div", "conv-row");
        row.append(el("strong", "", convTitle(c)), el("time", "", fullTime(m.created_at)));
        const snippet = el("div", "conv-preview");
        snippet.append(el("b", "", (m.sender_id === state.me.id ? "Ви" : userName(m.sender_id)) + ": "), highlight(m.text || "Фото", q));
        const sub = el("div", "conv-sub");
        sub.append(snippet);
        const body = el("div", "conv-body");
        body.append(row, sub);
        li.append(avatar(convTitle(c), 50), body);
        li.onclick = () => openConv(c, { messageId: m.id });
        items.push(li);
      }
      $("conv-list").replaceChildren(...items);
    }

    async function runGlobalSearch() {
      const q = $("search-q").value.trim();
      if (!q) { state.search = { q: "", results: null }; renderConvs(); return; }
      try {
        const found = await api("GET", `/search?q=${encodeURIComponent(q)}`);
        if ($("search-q").value.trim() !== q) return;  // the user kept typing
        state.search = { q, results: found };
        renderConvs();
      } catch (err) {
        showError("chat-error", err);
      }
    }
    $("search-q").oninput = () => { clearTimeout(searchTimer); searchTimer = setTimeout(runGlobalSearch, 300); };
    $("search-form").onsubmit = (e) => { e.preventDefault(); clearTimeout(searchTimer); runGlobalSearch(); };

    // ---- modal ----
    function openModal(nodes, wide = false) {
      $("modal-box").classList.toggle("wide", wide);
      $("modal-content").replaceChildren(...nodes);
      $("modal").classList.remove("hidden");
    }
    function closeModal() {
      $("modal").classList.add("hidden");
      $("modal-content").replaceChildren();
    }
    $("modal-close").onclick = closeModal;
    $("modal").onclick = (e) => { if (e.target === $("modal")) closeModal(); };
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") { closeModal(); closeMenu(); }
    });

    // Rows with checkboxes for choosing people; used by "new chat" and "add members".
    function renderPick(list, users, selected, filterText, onToggle) {
      const f = filterText.trim().toLowerCase();
      const rows = users
        .filter((u) => !f || (u.username + " " + u.tag).toLowerCase().includes(f))
        .map((u) => {
          const row = el("label", "pick-row");
          const info = el("div", "grow");
          info.append(el("b", "", u.username), document.createElement("br"), el("small", "", tagOf(u)));
          const cb = document.createElement("input");
          cb.type = "checkbox";
          cb.checked = selected.has(u.id);
          cb.onchange = () => {
            if (cb.checked) selected.add(u.id); else selected.delete(u.id);
            onToggle();
          };
          row.append(avatar(u.username, 40), info, cb);
          return row;
        });
      list.replaceChildren(...(rows.length ? rows : [el("p", "hint", "Нікого не знайдено")]));
    }

    async function showNewChat() {
      try { state.users = await api("GET", "/users"); } catch (err) { showError("chat-error", err); return; }
      const selected = new Set();
      const hint = el("p", "hint", "Оберіть одну людину для особистого чату або кількох, щоб створити групу.");
      const filter = el("input", "field");
      filter.placeholder = "Пошук людей";
      filter.autocomplete = "off";
      const list = el("div", "pick-list");
      const title = el("input", "field hidden");
      title.placeholder = "Назва групи (необов'язково)";
      title.maxLength = 64;
      const err = el("p", "error");
      const create = el("button", "btn", "Почати чат");
      create.disabled = true;

      function renderList() {
        renderPick(list, state.users.filter((u) => u.id !== state.me.id && !u.is_bot), selected, filter.value, () => {
          title.classList.toggle("hidden", selected.size < 2);
          create.disabled = selected.size < 1;
          create.textContent = selected.size >= 2 ? "Створити групу" : "Почати чат";
          err.textContent = "";
        });
      }
      filter.oninput = renderList;
      create.onclick = async () => {
        err.textContent = "";
        try {
          const c = await api("POST", "/conversations", {
            participant_ids: [...selected],
            title: selected.size >= 2 ? title.value.trim() || null : null,
          });
          closeModal();
          await refreshConvs();
          openConv(state.convs.find((x) => x.id === c.id) || c);
        } catch (e) {
          err.textContent = errText(e.message);

      };
      renderList();
      openModal([el("h3", "", "Нова розмова"), hint, filter, list, title, err, create]);
    }
    $("new-chat").onclick = showNewChat;

    // ---- chat ----
    function saveDraft() {
      if (!state.current) return;
      const v = $("text").value;
      if (v) state.drafts[state.current.id] = v; else delete state.drafts[state.current.id];
    }

    function resetChat() {
      saveDraft();
      state.current = null;
      state.msgs = [];
      state.msgSig = "";
      $("text").value = "";
      $("chat-title").textContent = "Оберіть розмову";
      $("chat-sub").textContent = "";
      $("chat-avatar").replaceChildren();
      $("menu-btn").classList.add("hidden");
      closeMenu();
      closeChatSearch(false);
      clearPhoto();
      $("messages").replaceChildren(emptyState("Оберіть розмову", "Виберіть чат зліва або створіть новий кнопкою з плюсом."));
      $("send-form").classList.add("hidden");
      setView("list");
      renderConvs();
    }

    function msgNode(m, opts = {}) {
      const classes = ["msg"];
      if (m.sender_id === state.me.id) classes.push("mine");
      if (opts.current) classes.push("cur-match");
      if (state.flashId === m.id && Date.now() < state.flashUntil) classes.push("flash");
      const div = el("div", classes.join(" "));
      div.dataset.id = m.id;
      if (opts.showSender && m.sender_id !== state.me.id) div.append(el("div", "who", userName(m.sender_id)));
      if (m.image_url) {
        const img = document.createElement("img");
        img.src = m.image_url;
        img.alt = "Фото";
        img.loading = "lazy";
        img.onclick = () => showImage(m.image_url);
        div.append(img);
      }
      if (m.text) {
        const body = el("div", "body");
        body.append(highlight(m.text, opts.highlight));
        div.append(body);
      }
      const time = el("time", "", timeOnly(m.created_at));
      time.dateTime = m.created_at;
      div.append(time);
      return div;
    }

    function updateHeader() {
      const c = state.current;
      if (!c) return;
      $("chat-title").textContent = convTitle(c);
      $("chat-avatar").replaceChildren(avatar(convTitle(c), 44));
      const other = otherUser(c);
      $("chat-sub").textContent = isGroup(c)
        ? c.participants.map((id) => tagOf(state.users.find((u) => u.id === id)) || userName(id)).join(", ")
        : tagOf(other);
      $("menu-btn").classList.remove("hidden");
      const iBlocked = !!other && state.blocked.has(other.id);
      menuItem("block").classList.toggle("hidden", isGroup(c) || !!c.is_bot_chat);
      setLabel("block", iBlocked ? "Розблокувати" : "Заблокувати");
      setLabel("delete", isGroup(c) ? "Вийти з групи" : "Видалити контакт");
      menuItem("members").classList.toggle("hidden", !isGroup(c));
      menuItem("rename").classList.toggle("hidden", !isAdmin(c));
      menuItem("deleteall").classList.toggle("hidden", !isAdmin(c));
      menuItem("clear").classList.toggle("hidden", isGroup(c) && !isAdmin(c));  // group: admin only
      for (const id of ["text", "attach"]) $(id).disabled = iBlocked;
      $("send-btn").disabled = iBlocked || state.sending;
      $("text").placeholder = iBlocked ? "Ви заблокували цього користувача" : composePlaceholder();
    }

    function scrollToMessage(id) {
      const n = $("messages").querySelector(`[data-id="${id}"]`);
      if (n) n.scrollIntoView({ block: "center" });
    }

    // jump: scroll to the current in-chat search match instead of sticking to the bottom.
    function renderMessages(forceScroll, jump = false) {
      const box = $("messages");
      const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
      const q = state.filter;
      const ql = q.toLowerCase();
      state.matchIds = q ? state.msgs.filter((m) => m.text.toLowerCase().includes(ql)).map((m) => m.id) : [];
      if (!state.matchIds.includes(state.matchId)) state.matchId = state.matchIds[state.matchIds.length - 1] || null;
      const pos = state.matchIds.indexOf(state.matchId);
      $("chat-search-count").textContent = !q ? "" : state.matchIds.length ? `${pos + 1} з ${state.matchIds.length}` : "Нічого не знайдено";
      const nodes = [];
      let lastDay = "";
      for (const m of state.msgs) {
        const label = dayLabel(m.created_at);
        if (label !== lastDay) {
          nodes.push(el("div", "day", label));
          lastDay = label;
        }
        nodes.push(msgNode(m, { showSender: isGroup(state.current), highlight: q, current: q && m.id === state.matchId }));
      }
      box.replaceChildren(...(nodes.length ? nodes : [emptyState("Тут поки тихо", "Напишіть перше повідомлення.")]));
      if (jump && state.matchId) scrollToMessage(state.matchId);
      else if (forceScroll || atBottom) box.scrollTop = box.scrollHeight;
    }

    // opts.messageId: jump to this message and flash it (used by the search results).
    async function openConv(c, opts = {}) {
      saveDraft();
      state.current = c;
      if (state.folder !== folderOf(c)) { state.folder = folderOf(c); renderConvs(); }
      closeMenu();
      closeChatSearch(false);
      clearPhoto();
      $("text").value = state.drafts[c.id] || "";
      $("send-form").classList.remove("hidden");
      clearError("chat-error");
      state.flashId = opts.messageId || null;
      state.flashUntil = opts.messageId ? Date.now() + 2300 : 0;
      state.msgSig = "";
      setView("chat");
      if (isMobile() && !state.pushed) { history.pushState({ chat: 1 }, ""); state.pushed = true; }
      updateHeader();
      renderConvs();
      await loadHistory(!opts.messageId);
      if (opts.messageId) scrollToMessage(opts.messageId);
      markReadIfNeeded();
      if (!isMobile()) $("text").focus();
    }

    function leaveChat() {
      if (state.pushed) history.back(); else resetChat();
    }
    $("back").onclick = leaveChat;
    window.addEventListener("popstate", () => {
      if (state.pushed) { state.pushed = false; resetChat(); }
    });

    async function loadHistory(forceScroll) {
      if (!state.current) return;
      const id = state.current.id;
      const req = ++historyRequest;
      let msgs;
      try {
        msgs = await api("GET", `/conversations/${id}/messages`);
      } catch (err) {
        showError("chat-error", err);
        return;
      }
      if (req !== historyRequest || !state.current || state.current.id !== id) return;
      const sig = msgs.map((m) => m.id).join(",");
      state.msgs = msgs;
      if (sig === state.msgSig && !forceScroll) return;  // nothing new: don't redraw (keeps scroll and images stable)
      state.msgSig = sig;
      renderMessages(forceScroll);
    }

    // ---- photo attachment: big phone photos are shrunk in the browser before upload ----
    const MAX_FILE = 25 * 1024 * 1024;
    function readDataUrl(blob) {
      return new Promise((resolve, reject) => {
        const r = new FileReader();
        r.onload = () => resolve(r.result);
        r.onerror = () => reject(new Error("Не вдалося прочитати файл"));
        r.readAsDataURL(blob);
      });
    }
    async function prepareImage(file) {
      const small = ["image/png", "image/jpeg", "image/webp"].includes(file.type) && file.size <= 700 * 1024;
      const gif = file.type === "image/gif" && file.size <= 5 * 1024 * 1024;
      if (small || gif) return readDataUrl(file);
      const url = URL.createObjectURL(file);
      try {
        const img = new Image();
        img.src = url;
        try { await img.decode(); } catch { throw new Error("Не вдалося обробити це фото. Спробуйте інший файл"); }
        const scale = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
        const w = Math.max(1, Math.round(img.naturalWidth * scale));
        const h = Math.max(1, Math.round(img.naturalHeight * scale));
        const canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#fff";
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        return canvas.toDataURL("image/jpeg", 0.82);
      } finally {
        URL.revokeObjectURL(url);
      }
    }

    function clearPhoto() {
      state.photo = null;
      state.photoBusy = false;
      $("file").value = "";
      $("attach-chip").classList.add("hidden");
    }
    $("attach").onclick = () => $("file").click();
    $("attach-clear").onclick = clearPhoto;
    $("file").onchange = async () => {
      const f = $("file").files[0];
      if (!f) return;
      if (f.size > MAX_FILE) {
        clearPhoto();
        showError("chat-error", "Файл завеликий (понад 25 МБ)");
        return;
      }
      state.photo = null;
      state.photoBusy = true;
      $("attach-name").textContent = "Обробка...";
      $("attach-chip").classList.remove("hidden");
      try {
        const data = await prepareImage(f);
        if (!state.photoBusy) return;  // cancelled meanwhile
        state.photo = data;
        state.photoBusy = false;
        $("attach-name").textContent = f.name;
        clearError("chat-error");
      } catch (err) {
        clearPhoto();
        showError("chat-error", err);
      }
    };

    $("send-form").onsubmit = async (e) => {
      e.preventDefault();
      if (!state.current || state.sending) return;
      if (state.photoBusy) { showError("chat-error", "Фото ще обробляється, зачекайте"); return; }
      const input = $("text");
      const text = input.value;
      if (!text.trim() && !state.photo) {
        showError("chat-error", "Повідомлення не може бути порожнім");
        return;
      }
      const convId = state.current.id;
      state.sending = true;
      $("send-btn").disabled = true;
      try {
        await api("POST", `/conversations/${convId}/messages`, { text, image_data: state.photo });
        delete state.drafts[convId];
        if (state.current && state.current.id === convId) {
          input.value = "";
          clearPhoto();
          clearError("chat-error");
          await loadHistory(true);
        }
        refreshConvs().catch(() => {});
      } catch (err) {
        showError("chat-error", err);
      } finally {
        state.sending = false;
        updateHeader();
      }
    };

    // ---- photos, members, rename ----
    function showImage(url) {
      const img = document.createElement("img");
      img.src = url;
      img.alt = "Фото";
      openModal([img], true);
    }

    async function showGallery() {
      await loadHistory(false);
      const photos = state.msgs.filter((m) => m.image_url);
      const h = el("h3", "", `Фотографії (${photos.length})`);
      if (!photos.length) {
        openModal([h, el("p", "hint", "У цьому чаті ще немає фото.")]);
        return;
      }
      const grid = el("div");
      grid.id = "gallery";
      grid.replaceChildren(...photos.map((m) => {
        const img = document.createElement("img");
        img.src = m.image_url;
        img.alt = "Фото";
        img.title = `${userName(m.sender_id)}, ${fullTime(m.created_at)}`;
        img.loading = "lazy";
        img.onclick = () => showImage(m.image_url);
        return img;
      }));
      openModal([h, grid], true);
    }

    function showMembers() {
      const c = state.current;
      const rows = c.participants.map((id) => {
        const u = state.users.find((x) => x.id === id);
        const row = el("div", "member");
        const info = el("div", "grow");
        const name = el("b", "", userName(id) + (id === state.me.id ? " (ви)" : ""));
        if (id === c.admin_id) name.append(el("span", "badge", "адмін"));
        info.append(name, document.createElement("br"), el("small", "", tagOf(u)));
        row.append(avatar(userName(id), 42), info);
        if (isAdmin(c) && id !== state.me.id) {
          const btn = el("button", "btn danger", "Видалити");
          btn.onclick = () => removeMember(id);
          row.append(btn);
        }
        return row;
      });
      const nodes = [el("h3", "", `Учасники (${c.participants.length})`), ...rows];
      if (isAdmin(c)) {
        const addBtn = el("button", "btn", "Додати учасників");
        addBtn.onclick = showAddMembers;
        nodes.push(addBtn);
      }
      openModal(nodes);
    }

    async function showAddMembers() {
      const c = state.current;
      try { state.users = await api("GET", "/users"); } catch (err) { showError("chat-error", err); return; }
      const candidates = state.users.filter((u) => !u.is_bot && !c.participants.includes(u.id));
      const h = el("h3", "", "Додати учасників");
      if (!candidates.length) {
        openModal([h, el("p", "hint", "Усі користувачі вже в цій групі.")]);
        return;
      }
      const selected = new Set();
      const filter = el("input", "field");
      filter.placeholder = "Пошук людей";
      filter.autocomplete = "off";
      const list = el("div", "pick-list");
      const err = el("p", "error");
      const add = el("button", "btn", "Додати");
      add.disabled = true;
      const render = () => renderPick(list, candidates, selected, filter.value, () => {
        add.disabled = selected.size < 1;
        add.textContent = selected.size > 1 ? `Додати (${selected.size})` : "Додати";
        err.textContent = "";
      });
      filter.oninput = render;
      add.onclick = async () => {
        err.textContent = "";
        try {
          await api("POST", `/conversations/${c.id}/members`, { user_ids: [...selected] });
          await refreshConvs();
          state.current = state.convs.find((x) => x.id === c.id) || state.current;
          updateHeader();
          showMembers();
        } catch (e) {
          err.textContent = errText(e.message);
        }
      };
      render();
      openModal([h, el("p", "hint", "Нові учасники бачитимуть усю історію чату."), filter, list, err, add]);
    }

    async function removeMember(id) {
      const u = state.users.find((x) => x.id === id);
      if (!confirm(`Видалити ${userName(id)} ${tagOf(u)} з групи?`)) return;
      try {
        const c = state.current;
        await api("DELETE", `/conversations/${c.id}/members/${id}`);
        await refreshConvs();
        state.current = state.convs.find((x) => x.id === c.id) || null;
        if (!state.current) { closeModal(); resetChat(); return; }
        updateHeader();
        showMembers();
      } catch (err) {
        closeModal();
        showError("chat-error", err);
      }
    }

    function showRename() {
      const c = state.current;
      const input = el("input", "field");
      input.value = c.title || "";
      input.placeholder = "Нова назва групи";
      input.maxLength = 64;
      const err = el("p", "error");
      const save = el("button", "btn", "Зберегти");
      const submit = async () => {
        err.textContent = "";
        try {
          await api("PATCH", `/conversations/${c.id}`, { title: input.value });
          await refreshConvs();
          state.current = state.convs.find((x) => x.id === c.id) || state.current;
          updateHeader();
          closeModal();
        } catch (e) {
          err.textContent = errText(e.message);
        }
      };
      save.onclick = submit;
      input.onkeydown = (e) => { if (e.key === "Enter") submit(); };
      openModal([el("h3", "", "Перейменувати групу"), input, err, save]);
      input.focus();
      input.select();
    }

    // ---- chat menu (three dots) ----
    function closeMenu() { $("menu").classList.add("hidden"); }
    $("menu-btn").onclick = (e) => { e.stopPropagation(); $("menu").classList.toggle("hidden"); };
    document.addEventListener("click", (e) => { if (!$("menu").contains(e.target)) closeMenu(); });

    // ---- search inside the chat: highlights matches and steps through them ----
    function openChatSearch() {
      $("chat-search").classList.remove("hidden");
      $("chat-search-q").focus();
    }
    function closeChatSearch(redraw = true) {
      $("chat-search").classList.add("hidden");
      $("chat-search-q").value = "";
      state.filter = "";
      state.matchIds = [];
      state.matchId = null;
      $("chat-search-count").textContent = "";
      if (redraw && state.current) renderMessages(false);
    }
    // step: -1 = older match, +1 = newer match (wraps around)
    function stepMatch(step) {
      const n = state.matchIds.length;
      if (!n) return;
      const pos = state.matchIds.indexOf(state.matchId);
      state.matchId = state.matchIds[(pos + step + n) % n];
      renderMessages(false, true);
    }
    $("chat-search-close").onclick = () => closeChatSearch(true);
    $("cs-prev").onclick = () => stepMatch(-1);
    $("cs-next").onclick = () => stepMatch(1);
    $("chat-search").onsubmit = (e) => { e.preventDefault(); stepMatch(-1); };
    $("chat-search-q").oninput = () => {
      state.filter = $("chat-search-q").value.trim();
      state.matchId = null;  // start from the newest match
      renderMessages(false, true);
    };

    async function refreshBlocked() {
      state.blocked = new Set(await api("GET", "/blocks"));
    }

    async function toggleBlock() {
      const other = otherUser(state.current);
      if (!other) return;
      const blocked = state.blocked.has(other.id);
      if (!blocked && !confirm(`Заблокувати ${other.username} (${tagOf(other)})? Ні ви, ні він не зможете писати в цей чат.`)) return;
      if (blocked) await api("DELETE", `/blocks?target_id=${encodeURIComponent(other.id)}`);
      else await api("POST", "/blocks", { target_id: other.id });
      await refreshBlocked();
      updateHeader();
      clearError("chat-error");
    }

    async function clearMessages() {
      if (!confirm("Видалити всі повідомлення та фото в цьому чаті? Вони зникнуть в усіх учасників, відновити не можна.")) return;
      await api("DELETE", `/conversations/${state.current.id}/messages`);
      await loadHistory(true);
      await refreshConvs();
    }

    async function deleteContact() {
      const c = state.current;
      const msg = isGroup(c)
        ? "Вийти з групи? Ви більше не бачитимете цю розмову."
        : "Видалити контакт? Розмову з усіма повідомленнями та фото буде видалено в обох учасників.";
      if (!confirm(msg)) return;
      await api("DELETE", `/conversations/${c.id}`);
      delete state.drafts[c.id];
      await refreshConvs();
      resetChat();
    }

    async function deleteGroupForAll() {
      if (!confirm("Видалити групу для всіх учасників разом з повідомленнями та фото? Відновити не можна.")) return;
      const id = state.current.id;
      await api("DELETE", `/conversations/${id}?everyone=true`);
      delete state.drafts[id];
      await refreshConvs();
      resetChat();
    }

    $("menu").onclick = async (e) => {
      const act = e.target.closest("button")?.dataset.act;
      if (!act || !state.current) return;
      closeMenu();
      try {
        if (act === "search") openChatSearch();
        else if (act === "photos") await showGallery();
        else if (act === "members") showMembers();
        else if (act === "rename") showRename();
        else if (act === "block") await toggleBlock();
        else if (act === "clear") await clearMessages();
        else if (act === "delete") await deleteContact();
        else if (act === "deleteall") await deleteGroupForAll();
      } catch (err) {
        showError("chat-error", err);
      }
    };

    // ---- polling (every 2 seconds) ----
    async function tick() {
      try {
        const before = state.convs.length;
        await refreshConvs();
        if (state.convs.length !== before) state.users = await api("GET", "/users");
        await refreshBlocked();
        if (state.current) {
          state.current = state.convs.find((c) => c.id === state.current.id) || null;
          if (!state.current) { closeModal(); resetChat(); return; }  // chat was deleted by someone else
          updateHeader();
        }
        await loadHistory(false);
        markReadIfNeeded();
      } catch (err) {
        if (state.token) showError("chat-error", err);
      }
    }
    window.addEventListener("resize", () => { if (state.current) updateHeader(); });
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") markReadIfNeeded(); });

    // ---- start ----
    paintIcons();
    paintThemeButtons();
    buildMenu();
    $("messages").replaceChildren(emptyState("Оберіть розмову", "Виберіть чат зліва або створіть новий кнопкою з плюсом."));
    (async () => {
      let token = null;
      try { token = sessionStorage.getItem("messengerToken"); } catch {}
      if (!token) return;
      state.token = token;
      try {
        await enter(await api("GET", "/me"), token);
      } catch {
        state.token = null;
      }
    })();
  </script>
</body>
</html>
